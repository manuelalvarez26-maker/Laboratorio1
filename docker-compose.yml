services:
  # ==========================================
  # APACHE HADOOP 3.4 (Namenode & Datanode)
  # ==========================================
  namenode:
    image: apache/hadoop:3.4.0
    container_name: namenode
    hostname: namenode
    environment:
      - ENSURE_NAMENODE_DIR=/tmp/hadoop-root/dfs/name
    command: >
      /bin/bash -c "
      if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then
        /opt/hadoop/bin/hdfs namenode -D fs.defaultFS=hdfs://namenode:9000 -format -force;
      fi;
      /opt/hadoop/bin/hdfs namenode -D fs.defaultFS=hdfs://namenode:9000 -D dfs.namenode.rpc-address=namenode:9000
      "
    ports:
      - "9870:9870"  # Web UI NameNode
      - "9000:9000"  # HDFS RPC
    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
    networks:
      - devbox-net

  datanode:
    image: apache/hadoop:3.4.0
    container_name: datanode
    hostname: datanode
    depends_on:
      - namenode
    command: >
      /bin/bash -c "
      sleep 5;
      /opt/hadoop/bin/hdfs datanode -D fs.defaultFS=hdfs://namenode:9000
      "
    volumes:
      - datanode_data:/tmp/hadoop-root/dfs/data
    networks:
      - devbox-net

  # ==========================================
  # APACHE SPARK (Master & Worker)
  # ==========================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master Port
    networks:
      - devbox-net

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"  # Spark Worker Web UI
    networks:
      - devbox-net

  # ==========================================
  # APACHE KAFKA 3.8
  # ==========================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - devbox-net

  # ==========================================
  # BASES DE DATOS (MongoDB 7.0 & PostgreSQL 16 Alpine)
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    volumes:
      - mongo_data:/data/db
    networks:
      - devbox-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: devdb
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devbox-net

  # ==========================================
  # WORKSPACE: JUPYTER + ANACONDA
  # ==========================================
  jupyter-workspace:
    image: jupyter/datascience-notebook:latest
    container_name: jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - devbox-net
  
  mysql:
    image: mysql:8.0
    container_name: mysql-server
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ventas_db
      MYSQL_USER: sqoopuser
      MYSQL_PASSWORD: sqooppassword
    networks:
      - devbox-net

networks:
  devbox-net:
    driver: bridge

volumes:
  namenode_data:
  datanode_data:
  kafka_data:
  mongo_data:
  postgres_data: